[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "brdftoolbox"
version = "2.0.0"
description = "Analytic and measured BRDFs: physical checks, importance sampling, MERL fitting, rendering, PyQt GUI."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10", "matplotlib>=3.7"]

[project.urls]
Homepage = "https://github.com/gaschenb/BRDF"
Repository = "https://github.com/gaschenb/BRDF"

[project.optional-dependencies]
gui = ["PyQt5>=5.15"]
test = ["pytest>=7"]

[project.scripts]
brdf-toolbox = "brdftoolbox.cli:main"
brdf-toolbox-gui = "brdftoolbox.gui.app:main"

[tool.setuptools.packages.find]
include = ["brdftoolbox*"]
